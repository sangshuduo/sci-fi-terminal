name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2, pinned to a reviewed commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev
      - name: Toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
