<?xml version="1.0" encoding="UTF-8"?>
<!-- sci-fi-terminal application icon. Original artwork for this project (MIT).
     A dark tile with a faint wireframe globe (the network panel) behind a
     terminal prompt, in the Signal theme's amber. Pure paths: no fonts. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2219"/>
      <stop offset="1" stop-color="#110E0A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Tile with a thin amber edge (macOS-style inset keeps a transparent margin). -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="512" cy="512" r="400" fill="url(#halo)"/>
    <!-- Wireframe globe: limb, equator, two parallels, three meridians. -->
    <g fill="none" stroke="#F2A93B" stroke-opacity="0.30" stroke-width="10">
      <circle cx="512" cy="512" r="300"/>
      <ellipse cx="512" cy="512" rx="300" ry="96"/>
      <path d="M 262 346 Q 512 420 762 346"/>
      <path d="M 262 678 Q 512 604 762 678"/>
      <ellipse cx="512" cy="512" rx="110" ry="300"/>
      <ellipse cx="512" cy="512" rx="220" ry="300"/>
    </g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#F2A93B" stroke-opacity="0.55" stroke-width="10"/>

  <!-- Terminal prompt: chevron and cursor bar, glowing amber. -->
  <g filter="url(#glow)" fill="none" stroke="#FFC766" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="330,392 452,512 330,632" stroke-width="64"/>
  </g>
  <rect x="492" y="592" width="202" height="60" rx="18" fill="#FFC766" filter="url(#glow)"/>
  <!-- Small teal signal dot, as on the globe's home spot. -->
  <circle cx="700" cy="364" r="26" fill="#7DBFAF"/>
  <circle cx="700" cy="364" r="50" fill="none" stroke="#7DBFAF" stroke-opacity="0.45" stroke-width="8"/>
</svg>
