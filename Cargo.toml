[workspace]
resolver = "3"
members = ["crates/terminal-core", "crates/platform", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sangshuduo/sci-fi-terminal"

[workspace.dependencies]
terminal-core = { path = "crates/terminal-core" }
platform = { path = "crates/platform" }
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "canvas", "tokio", "advanced", "thread-pool"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
netstat2 = "0.11.2"
maxminddb = "0.32.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
